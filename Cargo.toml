[package]
name = "raster"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
description = "RasterKV 嵌入式键值存储的模块骨架"

[lib]
path = "src/lib.rs"

[features]
default = []
# 仅控制后端骨架的编译，不表示已经实现对应能力。
io-uring = []
config-toml = ["dep:toml"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[dependencies]
cap-std = "=4.0.3"

# 只启用完整语法解析；字段映射与校验由配置模块负责。
toml = { version = "=1.1.6", optional = true, default-features = false, features = ["std", "parse"] }
