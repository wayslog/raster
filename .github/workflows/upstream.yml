name: P9 Upstream contract and life cycle comparison
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-${{ github.ref }}
  cancel-in-progress: true
jobs:
  upstream:
    name: Fixed upstream, forced tombstone contract, and lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out RasterKV
        uses: actions/checkout@v6
      - name: Checkout fixed upstream
        uses: actions/checkout@v6
        with:
          repository: microsoft/FASTER
          ref: 321d872eabda6a0345c8bd76419f89723ed864ae
          path: target/upstream-source
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
      - name: Install upstream base build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ libaio-dev libtbb-dev uuid-dev
      - name: Record the native environment
        shell: bash
        run: |
          mkdir -p target/p9-upstream-evidence
          {
            git rev-parse HEAD
            git -C target/upstream-source rev-parse HEAD
            rustc -Vv
            cargo -V
            g++ --version
            uname -srm
            cat /etc/os-release
            stat -f -c 'file_system:%T' .
          } > target/p9-upstream-evidence/environment.txt
      - name: Build the original upstream core and behavioral executors
        shell: bash
        run: |
          set -o pipefail
          sh tools/upstream/build.sh target/upstream-source target/p9-build 2>&1 |
            sed -e "s|$GITHUB_WORKSPACE|worktree|g" -e "s|$HOME|user_directory|g" |
            tee target/p9-upstream-evidence/build.txt
      - name: Verify the running environment and save the original return difference
        shell: bash
        run: |
          set -o pipefail
          export CARGO_TERM_COLOR=never
          export RUST_BACKTRACE=0
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=worktree --remap-path-prefix=$HOME=user_directory"
          python3 tools/upstream/probe.py --cpp target/p9-build/faster-replay --corrected-cpp target/p9-build/faster-replay-retained --output target/p9-upstream-evidence |
            tee target/p9-upstream-evidence/checks.txt
      - name: Null Compare with file backend fixed seed contract
        shell: bash
        run: |
          set -o pipefail
          export CARGO_TERM_COLOR=never
          export RUST_BACKTRACE=0
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=worktree --remap-path-prefix=$HOME=user_directory"
          cp target/p9-build/forced-tombstone.diff target/p9-build/forced-tombstone.json target/p9-upstream-evidence/
          python3 -B tools/upstream/compare.py --cpp target/p9-build/faster-replay --corrected-cpp target/p9-build/faster-replay-retained --output target/p9-upstream-evidence/random-null
          python3 -B tools/upstream/compare.py --cpp target/p9-build/faster-replay --corrected-cpp target/p9-build/faster-replay-retained --output target/p9-upstream-evidence/random-file --disk
      - name: Compare checkpoint modes and over-memory lifecycle
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -o pipefail
          export CARGO_TERM_COLOR=never
          export RUST_BACKTRACE=0
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=worktree --remap-path-prefix=$HOME=user_directory"
          python3 -B tools/upstream/lifecycle.py --cpp target/p9-build/faster-replay --output target/p9-lifecycle-evidence |
            tee target/p9-lifecycle.log
      - name: Preserve original evidence of life cycle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p9-upstream-lifecycle
          path: |
            target/p9-lifecycle-evidence
            target/p9-lifecycle.log
          if-no-files-found: warn
      - name: Save failed synthetic storage material
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p9-upstream-failure-materials
          path: ${{ runner.temp }}/raster-lifecycle-*
          if-no-files-found: ignore
      - name: Preserve upstream environmental evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p9-upstream-environment
          path: target/p9-upstream-evidence
          if-no-files-found: warn
