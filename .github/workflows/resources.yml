name: P9 同进程资源循环
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: resources-${{ github.ref }}
  cancel-in-progress: true
jobs:
  resources:
    name: 完整生命周期与资源（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
      - name: 安装固定工具链
        uses: dtolnay/rust-toolchain@1.98.1
      - name: 记录原生环境
        shell: bash
        run: |
          mkdir -p target/p9-resource-evidence
          {
            git rev-parse HEAD
            rustc -Vv
            cargo -V
            uname -srm
            echo "镜像：${ImageOS:-未知} ${ImageVersion:-未知}"
            echo '特性：all；模式：release；预热：8；测量：64'
            if [ "$(uname -s)" = Darwin ]; then
              sw_vers
              sysctl -n machdep.cpu.brand_string hw.memsize
              diskutil info "$(df -P . | awk 'NR==2 {print $1}')" | sed -n '/File System Personality/p'
            else
              cat /etc/os-release
              lscpu
              sed -n '/MemTotal/p' /proc/meminfo
              stat -f -c '文件系统：%T' .
            fi
          } > target/p9-resource-evidence/environment.txt
      - name: 运行计数检查与完整循环
        shell: bash
        run: |
          set -o pipefail
          export CARGO_TERM_COLOR=never
          export RUST_BACKTRACE=0
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=工作树 --remap-path-prefix=$HOME=用户目录"
          export RASTER_RESOURCE_OUTPUT=target/p9-resource-evidence/resources.csv
          {
            cargo test --locked --all-features --test p9_allocator &&
            cargo run --locked --release --all-features --example resource_cycles
          } 2>&1 | sed -e "s|$GITHUB_WORKSPACE|工作树|g" -e "s|$HOME|用户目录|g" |
            tee target/p9-resource-evidence/checks.txt
      - name: 保存逐轮资源与失败材料
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p9-resources-${{ matrix.os }}
          path: target/p9-resource-evidence
          if-no-files-found: error
