name: P9 Same process resource cycle
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: resources-${{ github.ref }}
  cancel-in-progress: true
jobs:
  resources:
    name: Complete lifecycle and resources (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@1.98.1
      - name: Record the native environment
        shell: bash
        run: |
          mkdir -p target/p9-resource-evidence
          {
            git rev-parse HEAD
            rustc -Vv
            cargo -V
            uname -srm
            echo "image:${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo 'features:all;mode:release;warmup:8;measurement:64'
            if [ "$(uname -s)" = Darwin ]; then
              sw_vers
              sysctl -n machdep.cpu.brand_string hw.memsize
              diskutil info "$(df -P . | awk 'NR==2 {print $1}')" | sed -n '/File System Personality/p'
            else
              cat /etc/os-release
              lscpu
              sed -n '/MemTotal/p' /proc/meminfo
              stat -f -c 'file_system:%T' .
            fi
          } > target/p9-resource-evidence/environment.txt
      - name: Run allocation checks and complete lifecycle
        shell: bash
        run: |
          set -o pipefail
          export CARGO_TERM_COLOR=never
          export RUST_BACKTRACE=0
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=worktree --remap-path-prefix=$HOME=user_directory"
          export RASTER_RESOURCE_OUTPUT=target/p9-resource-evidence/resources.csv
          {
            cargo test --locked --all-features --test p9_allocator &&
            cargo run --locked --release --all-features --example resource_cycles
          } 2>&1 | sed -e "s|$GITHUB_WORKSPACE|worktree|g" -e "s|$HOME|user_directory|g" |
            tee target/p9-resource-evidence/checks.txt
      - name: Save round-by-round resources and failed materials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p9-resources-${{ matrix.os }}
          path: target/p9-resource-evidence
          if-no-files-found: error
