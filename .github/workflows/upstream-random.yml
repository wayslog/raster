name: P9 Random Contract Comparison (Keep Original Differences)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison:
    name: native randomized control / ${{ matrix.backend }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        backend: ["null", file]
    steps:
      - name: Check out RasterKV
        uses: actions/checkout@v6
      - name: Checkout fixed upstream
        uses: actions/checkout@v6
        with:
          repository: microsoft/FASTER
          ref: 321d872eabda6a0345c8bd76419f89723ed864ae
          path: target/upstream-source
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
      - name: Install upstream build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ libaio-dev libtbb-dev uuid-dev
      - name: Record the native environment and build the executor
        shell: bash
        run: |
          mkdir -p target/p9-random
          {
            git rev-parse HEAD
            git -C target/upstream-source rev-parse HEAD
            rustc -Vv
            cargo -V
            g++ --version
            uname -srm
            cat /etc/os-release
            stat -f -c 'file_system:%T' .
          } > target/p9-random/environment.txt
          set -o pipefail
          sh tools/upstream/build.sh target/upstream-source target/p9-build 2>&1 |
            sed -e "s|$GITHUB_WORKSPACE|worktree|g" -e "s|$HOME|user_directory|g" |
            tee target/p9-random/build.txt
      - name: Operation-by-operation comparison of fixed bounds and five random seeds
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          set -o pipefail
          export CARGO_TERM_COLOR=never
          export RUST_BACKTRACE=0
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=worktree --remap-path-prefix=$HOME=user_directory"
          options=()
          if [ "$BACKEND" = file ]; then options+=(--disk); fi
          python3 -B tools/upstream/compare.py --cpp target/p9-build/faster-replay --corrected-cpp target/p9-build/faster-replay-retained --output target/p9-random/comparison "${options[@]}" |
            tee target/p9-random/checks.txt
      - name: Save original input and output and all differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p9-random-${{ matrix.backend }}
          path: target/p9-random
          if-no-files-found: error
