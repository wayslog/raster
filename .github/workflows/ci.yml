name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  check:
    name: Rust 检查（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 第一期正式验收平台；Windows 和 io_uring 后置。
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: 缓存 Cargo 依赖和构建产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 检查格式
        run: cargo fmt --all -- --check

      - name: 运行 Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: 运行测试
        run: cargo test --all-features

      - name: 生成文档
        run: cargo doc --all-features --no-deps
