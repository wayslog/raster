name: P9 Failure and History Matrix
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: faults-${{ github.ref }}
  cancel-in-progress: true
jobs:
  faults:
    name: Failure and complete history (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@1.98.1
      - name: Record the native environment
        shell: bash
        run: |
          mkdir -p target/p9-fault-evidence
          {
            git rev-parse HEAD
            rustc -Vv
            cargo -V
            uname -srm
            echo "image:${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo 'features:all'
            if [ "$(uname -s)" = Darwin ]; then
              sw_vers
              diskutil info "$(df -P . | awk 'NR==2 {print $1}')" | sed -n '/File System Personality/p'
            else
              cat /etc/os-release
              stat -f -c 'file_system:%T' .
            fi
          } > target/p9-fault-evidence/environment.txt
      - name: Itemized execution failures and history matrix
        shell: bash
        run: |
          set -o pipefail
          export CARGO_TERM_COLOR=never
          export RUST_BACKTRACE=0
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=worktree --remap-path-prefix=$HOME=user_directory"
          python3 tools/acceptance/run_faults.py --output target/p9-fault-evidence/results |
            tee target/p9-fault-evidence/checks.txt
      - name: Save matrix and item-wise raw output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p9-faults-${{ matrix.os }}
          path: target/p9-fault-evidence
          if-no-files-found: warn
