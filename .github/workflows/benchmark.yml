name: P9 完整性能矩阵
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  benchmark:
    name: 固定矩阵与恢复（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
      - name: 安装固定工具链
        uses: dtolnay/rust-toolchain@1.98.1
      - name: 记录原生环境
        shell: bash
        run: |
          mkdir -p target/p9-benchmark-evidence
          {
            git rev-parse HEAD
            rustc -Vv
            cargo -V
            uname -srm
            echo "镜像：${ImageOS:-未知} ${ImageVersion:-未知}"
            echo '特性：all；模式：release；完整矩阵：48；每组业务操作：16384'
            if [ "$(uname -s)" = Darwin ]; then
              sw_vers
              sysctl -n machdep.cpu.brand_string hw.memsize hw.physicalcpu hw.logicalcpu
              diskutil info "$(df -P . | awk 'NR==2 {print $1}')" | sed -n '/File System Personality/p'
            else
              cat /etc/os-release
              lscpu
              sed -n '/MemTotal/p' /proc/meminfo
              stat -f -c '文件系统：%T' .
            fi
          } > target/p9-benchmark-evidence/environment.txt
      - name: 验证计量与运行全部场景
        shell: bash
        run: |
          set -o pipefail
          export CARGO_TERM_COLOR=never
          export RUST_BACKTRACE=0
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=工作树 --remap-path-prefix=$HOME=用户目录"
          export RASTER_BENCH_OUTPUT=target/p9-benchmark-evidence/matrix
          unset RASTER_BENCH_CASE
          {
            cargo test --locked --all-features --test p9_benchmark_support &&
            cargo run --locked --release --all-features --example benchmark
          } 2>&1 | sed -e "s|$GITHUB_WORKSPACE|工作树|g" -e "s|$HOME|用户目录|g" |
            tee target/p9-benchmark-evidence/checks.txt
      - name: 复核矩阵和固定输入
        shell: bash
        run: python3 tools/acceptance/audit_benchmark.py target/p9-benchmark-evidence/matrix
      - name: 保存性能环境和原始证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p9-benchmark-${{ matrix.os }}
          path: target/p9-benchmark-evidence
          if-no-files-found: error
