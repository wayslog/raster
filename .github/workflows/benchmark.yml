name: P9 Complete Performance Matrix
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Benchmark suite
        type: choice
        options: [matrix, cpp-parity]
        default: matrix
      case:
        description: Optional direct benchmark filter (operation/distribution/threads)
        type: string
        default: ''
      baseline_ref:
        description: Optional full Rust commit SHA for a paired regression comparison
        type: string
        default: ''
      scan_baseline_ref:
        description: Optional full Rust commit SHA for an additional scan regression baseline
        type: string
        default: ''
      memory_baseline_ref:
        description: Optional full Rust commit SHA for an additional memory regression baseline
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  benchmark:
    if: inputs.mode != 'cpp-parity'
    name: Fixed matrix and recovery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@1.98.1
      - name: Record the native environment
        shell: bash
        run: |
          mkdir -p target/p9-benchmark-evidence
          {
            git rev-parse HEAD
            rustc -Vv
            cargo -V
            uname -srm
            echo "image:${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo 'features:all;mode:release;complete matrix:48;Each group of business operations:16384'
            if [ "$(uname -s)" = Darwin ]; then
              sw_vers
              sysctl -n machdep.cpu.brand_string hw.memsize hw.physicalcpu hw.logicalcpu
              diskutil info "$(df -P . | awk 'NR==2 {print $1}')" | sed -n '/File System Personality/p'
            else
              cat /etc/os-release
              lscpu
              sed -n '/MemTotal/p' /proc/meminfo
              stat -f -c 'file_system:%T' .
            fi
          } > target/p9-benchmark-evidence/environment.txt
      - name: Verify metering and run all scenarios
        shell: bash
        run: |
          set -o pipefail
          export CARGO_TERM_COLOR=never
          export RUST_BACKTRACE=0
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=worktree --remap-path-prefix=$HOME=user_directory"
          export RASTER_BENCH_OUTPUT=target/p9-benchmark-evidence/matrix
          unset RASTER_BENCH_CASE
          {
            cargo test --locked --all-features --test p9_benchmark_support &&
            cargo run --locked --release --all-features --example benchmark
          } 2>&1 | sed -e "s|$GITHUB_WORKSPACE|worktree|g" -e "s|$HOME|user_directory|g" |
            tee target/p9-benchmark-evidence/checks.txt
      - name: Review matrices and fixed inputs
        shell: bash
        run: python3 tools/acceptance/audit_benchmark.py target/p9-benchmark-evidence/matrix
      - name: Preserve performance environment and original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p9-benchmark-${{ matrix.os }}
          path: target/p9-benchmark-evidence
          if-no-files-found: error
  cpp-parity:
    if: inputs.mode == 'cpp-parity'
    name: Direct C++ and Rust engine comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out RasterKV
        uses: actions/checkout@v6
      - name: Check out pinned upstream
        uses: actions/checkout@v6
        with:
          repository: microsoft/FASTER
          ref: 321d872eabda6a0345c8bd76419f89723ed864ae
          path: target/upstream-source
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
      - name: Install native C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ libaio-dev libtbb-dev uuid-dev
      - name: Build optimized engines and record environment
        id: build
        shell: bash
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
          SCAN_BASELINE_REF: ${{ inputs.scan_baseline_ref }}
          MEMORY_BASELINE_REF: ${{ inputs.memory_baseline_ref }}
        run: |
          mkdir -p target/parity-evidence
          {
            git rev-parse HEAD
            rustc -Vv
            g++ --version
            uname -srm
            lscpu
            cat /etc/os-release
            stat -f -c 'file_system:%T' .
          } > target/parity-evidence/environment.txt
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=worktree --remap-path-prefix=$HOME=user_directory"
          cargo build --locked --release --example parity --example parity_scan
          cargo build --locked --release --all-features --example benchmark --example benchmark_probe
          sh tools/performance/build.sh target/upstream-source target/parity-build
          if [ -n "$BASELINE_REF" ]; then
            [[ "$BASELINE_REF" =~ ^[0-9a-f]{40}$ ]]
            git fetch --no-tags --depth=1 origin "$BASELINE_REF"
            git worktree add --detach target/parity-baseline "$BASELINE_REF"
            # Use identical drivers, including when a baseline predates an example.
            cp examples/parity.rs target/parity-baseline/examples/parity.rs
            cp examples/parity_scan.rs target/parity-baseline/examples/parity_scan.rs
            cargo build --manifest-path target/parity-baseline/Cargo.toml \
              --target-dir target/parity-baseline-build --locked --release --example parity --example parity_scan
            mkdir -p target/parity-baseline/examples/benchmark target/parity-baseline/tests/support
            cp -R examples/benchmark/. target/parity-baseline/examples/benchmark/
            cp examples/benchmark_probe.rs target/parity-baseline/examples/benchmark_probe.rs
            cp tests/support/model.rs tests/support/trace.rs target/parity-baseline/tests/support/
            cargo build --manifest-path target/parity-baseline/Cargo.toml \
              --target-dir target/parity-baseline-build --locked --release --all-features \
              --example benchmark --example benchmark_probe
            echo "rust_baseline:$BASELINE_REF" >> target/parity-evidence/environment.txt
          fi
          if [ -n "$SCAN_BASELINE_REF" ]; then
            [[ "$SCAN_BASELINE_REF" =~ ^[0-9a-f]{40}$ ]]
            git fetch --no-tags --depth=1 origin "$SCAN_BASELINE_REF"
            git worktree add --detach target/parity-scan-baseline "$SCAN_BASELINE_REF"
            cp examples/parity_scan.rs target/parity-scan-baseline/examples/parity_scan.rs
            cargo build --manifest-path target/parity-scan-baseline/Cargo.toml \
              --target-dir target/parity-scan-baseline-build --locked --release --example parity_scan
            echo "rust_scan_baseline:$SCAN_BASELINE_REF" >> target/parity-evidence/environment.txt
          fi
          if [ -n "$MEMORY_BASELINE_REF" ]; then
            [[ "$MEMORY_BASELINE_REF" =~ ^[0-9a-f]{40}$ ]]
            git fetch --no-tags --depth=1 origin "$MEMORY_BASELINE_REF"
            git worktree add --detach target/parity-memory-baseline "$MEMORY_BASELINE_REF"
            cp examples/parity.rs target/parity-memory-baseline/examples/parity.rs
            cargo build --manifest-path target/parity-memory-baseline/Cargo.toml \
              --target-dir target/parity-memory-baseline-build --locked --release --example parity
            echo "rust_memory_baseline:$MEMORY_BASELINE_REF" >> target/parity-evidence/environment.txt
          fi
          # Keep native code evidence to distinguish source changes from build or run variation.
          mkdir -p target/parity-evidence/native-code
          for variant in candidate baseline scan-baseline memory-baseline; do
            if [ "$variant" = candidate ]; then
              build_root=target
              source_root=.
            else
              build_root="target/parity-$variant-build"
              source_root="target/parity-$variant"
            fi
            if [ ! -d "$source_root/src" ]; then
              continue
            fi
            (
              cd "$source_root"
              git ls-files -z src | xargs -0 sha256sum
            ) > "target/parity-evidence/native-code/$variant-source.sha256"
            for program in parity parity_scan; do
              executable="$build_root/release/examples/$program"
              if [ -f "$executable" ]; then
                sha256sum "$executable" >> target/parity-evidence/native-code/binaries.sha256
                objdump -d -C "$executable" > "target/parity-evidence/native-code/$variant-$program.asm"
              fi
            done
          done
      - name: Compare alternating native engine samples
        shell: bash
        env:
          CASE_FILTER: ${{ inputs.case }}
        run: |
          set -o pipefail
          python3 -u tools/performance/compare.py --rust target/release/examples/parity \
            --cpp target/parity-build/faster-memory --output target/parity-evidence/memory \
            --case "$CASE_FILTER" 2>&1 | tee target/parity-evidence/checks.txt
      - name: Compare the preserved Rust baseline on the same runner
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.baseline_ref != '' }}
        shell: bash
        env:
          CASE_FILTER: ${{ inputs.case }}
        run: |
          set -o pipefail
          python3 -u tools/performance/compare.py --rust target/release/examples/parity \
            --baseline-rust target/parity-baseline-build/release/examples/parity \
            --output target/parity-evidence/rust-baseline --min-throughput 0.98 --max-p99 1.10 \
            --case "$CASE_FILTER" 2>&1 | tee target/parity-evidence/baseline-checks.txt
      - name: Compare the additional preserved memory baseline on the same runner
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.memory_baseline_ref != '' }}
        shell: bash
        env:
          CASE_FILTER: ${{ inputs.case }}
        run: |
          set -o pipefail
          python3 -u tools/performance/compare.py --rust target/release/examples/parity \
            --baseline-rust target/parity-memory-baseline-build/release/examples/parity \
            --output target/parity-evidence/rust-baseline-anchor --min-throughput 0.98 --max-p99 1.10 \
            --case "$CASE_FILTER" 2>&1 | tee target/parity-evidence/baseline-anchor-checks.txt
      - name: Compare resident append and scans against the Rust baseline
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.baseline_ref != '' }}
        shell: bash
        run: |
          set -o pipefail
          python3 -u tools/performance/compare_scan.py \
            --baseline target/parity-baseline-build/release/examples/parity_scan \
            --candidate target/release/examples/parity_scan \
            --output target/parity-evidence/resident-scans 2>&1 | tee target/parity-evidence/scan-checks.txt
      - name: Compare resident scans against the additional preserved baseline
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.scan_baseline_ref != '' }}
        shell: bash
        run: |
          set -o pipefail
          python3 -u tools/performance/compare_scan.py \
            --baseline target/parity-scan-baseline-build/release/examples/parity_scan \
            --candidate target/release/examples/parity_scan \
            --output target/parity-evidence/resident-scans-anchor 2>&1 | tee target/parity-evidence/scan-anchor-checks.txt
      - name: Compare repeated variable-memory operations with an identical baseline control
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.baseline_ref != '' }}
        shell: bash
        run: |
          set -o pipefail
          python3 -u tools/performance/compare_repeat.py \
            --baseline target/parity-baseline-build/release/examples/benchmark_probe \
            --candidate target/release/examples/benchmark_probe --repetitions 32 \
            --output target/parity-evidence/variable-repeat 2>&1 | tee target/parity-evidence/repeat-checks.txt
      - name: Compare complete lifecycles against the Rust baseline
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.baseline_ref != '' }}
        shell: bash
        run: |
          set -o pipefail
          python3 -u tools/acceptance/paired_benchmark.py \
            --baseline target/parity-baseline-build/release/examples/benchmark \
            --candidate target/release/examples/benchmark \
            --interleaved-control \
            --output target/parity-evidence/lifecycles 2>&1 | tee target/parity-evidence/lifecycle-checks.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path('target/parity-evidence/lifecycles/comparison.json').read_text())
          assert {row['case'] for row in rows} == {'u64-hot-t4-disk-r1', 'bytes-uniform-t1-disk-r1', 'bytes-hot-t1-memory-r1'}
          failures = [row['case'] for row in rows if row['throughput_ratio'] < .98 or row['p99_ratio'] > 1.10]
          controls = [row['case'] for row in rows if row['control_throughput_ratio'] < .98 or row['control_p99_ratio'] > 1.10]
          print('Strict lifecycle failures:', failures)
          print('Identical-baseline control failures:', controls)
          assert not failures, failures
          assert not controls, controls
          PY
      - name: Preserve results even when parity fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-rust-parity
          path: target/parity-evidence
          if-no-files-found: error
