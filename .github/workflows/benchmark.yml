name: S0 Interleaved Measurement
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s0-interleaved-${{ github.ref }}
  cancel-in-progress: false
jobs:
  measure:
    name: ${{ matrix.operation }}/${{ matrix.distribution }}/${{ matrix.threads }}/${{ matrix.count }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        operation: [read, upsert, rmw]
        distribution: [uniform, worker-hot, shared-hot]
        threads: [1, 4]
        count: [2000000, 400000000]
    steps:
      - name: Check out frozen measurement tools
        timeout-minutes: 2
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check out fixed observed Rust
        timeout-minutes: 2
        uses: actions/checkout@v6
        with:
          ref: f0ccb4604220231d2b2edce492b77822d75af2e9
          path: source/candidate
          persist-credentials: false
      - name: Check out fixed reference Rust
        timeout-minutes: 2
        uses: actions/checkout@v6
        with:
          ref: 57637a12b9751064b6bbbbde7127b27c8af62128
          path: source/baseline
          persist-credentials: false
      - name: Check out fixed C++
        timeout-minutes: 2
        uses: actions/checkout@v6
        with:
          repository: microsoft/FASTER
          ref: 321d872eabda6a0345c8bd76419f89723ed864ae
          path: source/cpp
          persist-credentials: false
      - name: Install pinned Rust
        timeout-minutes: 5
        uses: dtolnay/rust-toolchain@1.98.1
      - name: Install native dependencies
        timeout-minutes: 7
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ libaio-dev libtbb-dev uuid-dev
      - name: Verify sources and build shared drivers
        timeout-minutes: 25
        run: python3 tools/s0_measurement/prepare.py --workspace "$GITHUB_WORKSPACE" --output evidence/preparation
      - name: Measure every frozen permutation once
        timeout-minutes: 290
        env:
          BENCH_CASE: ${{ matrix.operation }}/${{ matrix.distribution }}/${{ matrix.threads }}
          BENCH_COUNT: ${{ matrix.count }}
        run: |
          set -o pipefail
          registration=tools/s0_measurement/preregistration.json
          registration_sha=$(cut -d ' ' -f 1 tools/s0_measurement/preregistration.sha256)
          receipt_sha=$(cut -d ' ' -f 1 evidence/preparation/build-receipt.sha256)
          python3 -u tools/s0_measurement/interleaved_w0.py \
            --baseline evidence/preparation/binaries/baseline \
            --candidate evidence/preparation/binaries/candidate \
            --cpp evidence/preparation/binaries/cpp \
            --case "$BENCH_CASE" --count "$BENCH_COUNT" --timeout 600 \
            --registration "$registration" --registration-sha256 "$registration_sha" \
            --build-receipt evidence/preparation/build-receipt.json --build-receipt-sha256 "$receipt_sha" \
            --output evidence/measurement \
            2> evidence/driver.stderr | tee evidence/driver.stdout
      - name: Preserve tools and complete artifact manifest
        if: always()
        timeout-minutes: 5
        run: |
          mkdir -p evidence/tools
          cp -R tools/s0_measurement/. evidence/tools/
          cp .github/workflows/benchmark.yml evidence/tools/benchmark.yml
          python3 tools/s0_measurement/package_evidence.py evidence
      - name: Upload original evidence including failures
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: s0-${{ matrix.operation }}-${{ matrix.distribution }}-${{ matrix.threads }}-${{ matrix.count }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
